services:
  redis:
    image: redis:alpine
    container_name: searxng-redis
    restart: unless-stopped
    networks:
      - npm_network
    volumes:
      - redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks:
      - npm_network
    ports:
      - "${PORT:-8443}:8080"
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./data:/etc/searxng/data:rw
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://localhost:8443}
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

networks:
  npm_network:
    external: true

volumes:
  redis-data:
