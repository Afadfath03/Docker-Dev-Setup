services:
  pihole:
    image: pihole/pihole:latest
    container_name: pi-hole
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "67:67/udp"     # DHCP server (comment out if not needed)
      - "8089:80/tcp"
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      FTLCONF_webserver_api_password: ${FTLCONF_WEBSERVER_API_PASSWORD}
      FTLCONF_dns_listeningMode: ALL
      PIHOLE_DNS_: ${PIHOLE_DNS_:-1.1.1.1;1.0.0.1}
    volumes:
      - ./etc-pihole:/etc/pihole
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/admin"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - npm_network

networks:
  npm_network:
    external: true
