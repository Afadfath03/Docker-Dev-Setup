networks:
  9router-net:
    driver: bridge

services:
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: unless-stopped

    networks:
      - 9router-net

    ports:
      - "${PORT:-20128}:${PORT:-20128}"

    volumes:
      - "${HOME}:/home/user"
      - 9router-data:/app/data
      - 9router-usage:/app/data-home

    environment:
      - DATA_DIR=${DATA_DIR:-/app/data}
      - PORT=${PORT:-20128}
      - HOSTNAME=${HOSTNAME:-0.0.0.0}
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - INITIAL_PASSWORD=${INITIAL_PASSWORD}
      - API_KEY_SECRET=${API_KEY_SECRET}
      - REQUIRE_API_KEY=${REQUIRE_API_KEY:-false}
      - MACHINE_ID_SALT=${MACHINE_ID_SALT:-endpoint-proxy-salt}
      - BASE_URL=${BASE_URL:-http://localhost:20128}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:20128}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - ENABLE_REQUEST_LOGS=${ENABLE_REQUEST_LOGS:-false}
    env_file:
      - .env

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:${PORT:-20128}/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  9router-data:
  9router-usage:
