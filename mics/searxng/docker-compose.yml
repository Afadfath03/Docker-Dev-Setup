services:
  redis:
    image: redis:alpine
    container_name: searxng-redis
    restart: unless-stopped
    networks:
      - npm_network
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks:
      - npm_network
    ports:
      - "${PORT:-8443}:8080"
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./data:/etc/searxng/data:rw
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://localhost:8443}
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  npm_network:
    external: true

volumes:
  redis_data:
    name: redis_data
