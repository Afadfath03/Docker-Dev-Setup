services:
  privatebin:
    image: privatebin/nginx-fpm-alpine:latest
    container_name: privatebin
    restart: unless-stopped
    networks:
      - npm_network
    ports:
      - "8080:8080"
    volumes:
      - privatebin_data:/srv/data
      # - ./conf.php:/srv/cfg/conf.php:ro  # uncomment to use custom config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  npm_network:
    external: true

volumes:
  privatebin_data:
    name: privatebin_data
