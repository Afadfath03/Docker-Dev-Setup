services:
  qa-playground:
    image: nginx:alpine
    container_name: qa-playground
    restart: unless-stopped
    networks:
      - npm_network
    ports:
      - "8088:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    deploy:
      resources:
        limits:
          memory: 32M

  qa-json-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa-json-server
    restart: unless-stopped
    networks:
      - npm_network
    ports:
      - "3003:3000"
    volumes:
      - ./db.json:/data/db.json:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  npm_network:
    external: true
