services:
  blocky:
    image: 0xERR0R/blocky:latest
    container_name: blocky-dns
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "4000:4000"
    volumes:
      - ./config.yml:/app/config.yml:ro
    cap_add:
      - NET_ADMIN
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"