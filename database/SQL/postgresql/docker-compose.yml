services:
  postgres:
    image: postgres:alpine
    container_name: postgres-db
    restart: unless-stopped
    networks:
      - npm_network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./pg_hba.conf:/config/pg_hba.conf:ro
    command: postgres -c hba_file=/config/pg_hba.conf
    shm_size: 256mb
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -q"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  npm_network:
    external: true

volumes:
  postgres_data:
    name: postgres_data
